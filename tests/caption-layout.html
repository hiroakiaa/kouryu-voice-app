<!doctype html><html lang="ja"><meta charset="utf-8"><title>会話の用語レイアウト試験</title>
<style>body{font:16px sans-serif}iframe{display:block;border:1px solid #789;margin:16px 0}pre{white-space:pre-wrap}</style>
<h1>会話の用語（合成文字、実マイク不使用）</h1><pre id="measurements"></pre>
<iframe id="mobile" title="390×700" width="390" height="700"></iframe>
<iframe id="short" title="390×550" width="390" height="550"></iframe>
<iframe id="desktop" title="900×800" width="900" height="800"></iframe>
<iframe id="boundary" title="640×800" width="640" height="800"></iframe>
<script type="module">
const html=await(await fetch('../index.html')).text(),doc=new DOMParser().parseFromString(html,'text/html');
const only=new URLSearchParams(location.search).get('frame');if(only)for(const frame of document.querySelectorAll('iframe'))if(frame.id!==only)frame.remove();
window.addEventListener('message',event=>{if(event.data?.measurement)document.querySelector('#measurements').textContent+=JSON.stringify(event.data)+'\n'});
const main=doc.querySelector('main');main.querySelector('#captionsPanel').hidden=false;
main.querySelector('#participants').innerHTML='<div class="participant">A</div><div class="participant">B</div><div class="participant">C</div><div class="participant">D</div>';
main.querySelector('#shareBtn').textContent='用語を追加';main.querySelector('#joinBtn').textContent='表示を計測';
for(const frame of document.querySelectorAll('iframe'))frame.srcdoc=`<!doctype html><html lang="ja"><meta name="viewport" content="width=device-width"><style>${doc.querySelector('style').textContent}</style><body class="has-captions">${main.outerHTML}<script type="module">
import {createTermAssist} from '../term-assist.js';
const controller=createTermAssist({root:document.querySelector('#captionsPanel'),getCall:()=>({joined:true,muted:true,userId:'self'}),speakerName:id=>id,send:()=>{},getExplanation:async()=> 'アプリやサービスが機能やデータをやり取りするための窓口や規約です。利用者が内部の詳しい仕組みを知らなくても、決められた方法で機能を呼び出せます。'});
document.querySelector('#shareBtn').onclick=()=>controller.receive('話者A',{type:'terms',terms:['API','WebRTC','機械学習','生成AI','データベース','アルゴリズム','クラウド','投資信託','インフォームドコンセント','損益計算書','貸借対照表','契約不適合責任','善管注意義務','インボイス制度','相関係数','標準偏差','NISA','ETF','MRI','糖尿病']});
document.querySelector('#joinBtn').onclick=()=>{window.scrollTo({top:document.body.scrollHeight,behavior:'instant'});const l=document.querySelector('[data-term-list]').getBoundingClientRect(),c=document.querySelector('.controls').getBoundingClientRect();parent.postMessage({measurement:'list',width:innerWidth,height:innerHeight,noOverlap:l.bottom<=c.top,pageWidth:document.documentElement.scrollWidth},'*')};
const dialog=document.querySelector('[data-term-dialog]');dialog.addEventListener('toggle',()=>{if(!dialog.open)return;const r=dialog.getBoundingClientRect(),h=dialog.querySelector('.caption-dialog-header').getBoundingClientRect();parent.postMessage({measurement:'dialog',width:innerWidth,height:innerHeight,within:r.top>=0&&r.bottom<=innerHeight&&r.left>=0&&r.right<=innerWidth,closeVisible:h.top>=0&&h.bottom<innerHeight},'*')});
<\/script></body></html>`;
</script></html>
