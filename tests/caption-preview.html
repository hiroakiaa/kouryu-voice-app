<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>字幕検証（合成データのみ）</title>
<style>body{font:16px sans-serif;margin:20px;background:#f7fce9;color:#294525}section{border:1px solid #85ac55;border-radius:15px;padding:16px;margin:12px 0}button{padding:10px;margin:6px}.caption-speaker{display:block;font-size:12px}.caption-list{max-height:180px;overflow:auto}.is-interim{opacity:.7}[hidden]{display:none!important}</style>
<h1>字幕の画面検証</h1><p>合成データによる4人の通信テストです。マイクは使用しません。</p>
<button id="connect">4人のテスト接続</button><button id="say" disabled>4人の発言を送る</button><button id="end">全員退室</button>
<button id="support">このブラウザーの日本語対応を確認</button><p id="supportResult"></p><p id="connection"></p><main></main>
<script type="module">
import {createCaptions} from '../captions.js';
const controllers=[], states=[], peers=[], channels=[], recognizers=[];
class SyntheticRecognition {
  static async available(){return 'available'}
  processLocally=true; start(){} abort(){}
}
for(let i=0;i<4;i++) {
 const root=document.createElement('section');
 root.innerHTML='<h2>端末 '+String.fromCharCode(65+i)+'</h2><button data-caption-toggle>字幕をON</button><p data-caption-status></p><button data-caption-prepare hidden>準備</button><div data-caption-list></div>';
 document.querySelector('main').append(root);
 states[i]={joined:true,muted:false,userId:String.fromCharCode(65+i)};
 channels[i]=[];
 const Recognition=class extends SyntheticRecognition { constructor(){super();recognizers[i]=this} };
 controllers[i]=createCaptions({root,getCall:()=>states[i],speakerName:id=>'匿名さん'+id,Recognition,
  send:packet=>channels[i].forEach(ch=>{if(ch.readyState==='open')ch.send(JSON.stringify(packet))})});
}
document.querySelector('#connect').onclick=async()=>{
 document.querySelector('#connect').disabled=true;
 const opened=[];
 for(let a=0;a<4;a++)for(let b=a+1;b<4;b++) {
  const left=new RTCPeerConnection(),right=new RTCPeerConnection();peers.push(left,right);
  left.onicecandidate=e=>{if(e.candidate)right.addIceCandidate(e.candidate).catch(()=>{})};
  right.onicecandidate=e=>{if(e.candidate)left.addIceCandidate(e.candidate).catch(()=>{})};
  const ch=left.createDataChannel('captions-test',{ordered:true,maxPacketLifeTime:5000}); channels[a].push(ch);
  ch.onmessage=e=>controllers[a].receive(states[b].userId,JSON.parse(e.data));
  opened.push(new Promise(resolve=>{ch.onopen=resolve}));
  opened.push(new Promise(resolve=>{right.ondatachannel=e=>{const remote=e.channel;channels[b].push(remote);remote.onmessage=e=>controllers[b].receive(states[a].userId,JSON.parse(e.data));remote.onopen=resolve}}));
  await left.setLocalDescription(await left.createOffer());await right.setRemoteDescription(left.localDescription);
  await right.setLocalDescription(await right.createAnswer());await left.setRemoteDescription(right.localDescription);
 }
 await Promise.all(opened);document.querySelector('#connection').textContent='4人・6組のWebRTC接続が完了';document.querySelector('#say').disabled=false;
};
document.querySelector('#say').onclick=()=>recognizers.forEach((speech,i)=>{const result=[{transcript:['WebRTCで直接通話します。','明日の午後3時に始めます。','字幕の意味を確認します。','料理にたとえると分かりやすいです。'][i]}];result.isFinal=true;speech.onresult?.({resultIndex:0,results:[result]})});
document.querySelector('#end').onclick=()=>{states.forEach(s=>s.joined=false);controllers.forEach(c=>c.sync());peers.forEach(p=>p.close());document.querySelector('#say').disabled=true;document.querySelector('#connection').textContent='全接続を閉じ、字幕を破棄しました'};
document.querySelector('#support').onclick=async()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;const output=document.querySelector('#supportResult');try{output.textContent=R?.available?await R.available({langs:['ja-JP'],processLocally:true}):'端末内認識APIなし'}catch(_){output.textContent='端末内認識の対応確認ができません'}};
</script></html>
