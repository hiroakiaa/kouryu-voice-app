<!doctype html>
<!-- kouryu standalone voice app shared default room 2026-08-07 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>共通電話</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg: #03101a;
      --panel: #061522;
      --panel-soft: #091b2a;
      --panel-raised: #0c2234;
      --line: #1b5570;
      --line-strong: #86e9ff;
      --text: #f2fbff;
      --muted: #bdd8e4;
      --quiet: #89a9b8;
      --accent: #8be9ff;
      --accent-deep: #38c6e8;
      --accent-soft: #0d3447;
      --danger: #ff6d92;
      --danger-soft: #2b0d18;
      --ok: #93e6ff;
      --warn: #c7f4ff;
      --control: #061521;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(0.7rem, env(safe-area-inset-top)) max(0.7rem, env(safe-area-inset-right)) max(0.7rem, env(safe-area-inset-bottom)) max(0.7rem, env(safe-area-inset-left));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(139, 233, 255, 0.12), transparent 22rem),
        radial-gradient(circle at 84% 92%, rgba(56, 198, 232, 0.1), transparent 18rem),
        var(--bg);
      overflow: hidden;
    }

    main {
      width: min(100%, 52rem);
      height: min(100svh - 1.4rem, 40rem);
      position: relative;
      display: grid;
      grid-template-rows: auto auto auto minmax(4.6rem, 1fr) auto auto;
      gap: 0.65rem;
      padding: clamp(0.8rem, 2vw, 1.15rem);
      border: 0.09rem solid var(--accent-deep);
      border-radius: 1.25rem;
      background: rgba(4, 18, 28, 0.96);
      overflow: hidden;
    }

    header {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      min-width: 0;
    }

    .app-icon {
      display: inline-grid;
      place-items: center;
      width: 2.8rem;
      height: 2.8rem;
      flex: 0 0 auto;
      border: 0.08rem solid var(--accent-deep);
      border-radius: 0.9rem;
      background: #0a2535;
      color: var(--accent);
      font-size: 1.15rem;
    }

    .brand {
      min-width: 0;
      flex: 1 1 auto;
    }

    .header-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: end;
      gap: 0.55rem;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.18rem, 3.8vw, 1.55rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .room-id {
      margin-top: 0.18rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .name-box {
      width: min(33vw, 9.4rem);
      display: grid;
      gap: 0.18rem;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .name-box input {
      min-height: 2.15rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.72rem;
      text-align: right;
    }

    .tips-toggle {
      width: 2.35rem;
      height: 2.35rem;
      min-height: 2.35rem;
      padding: 0;
      border-color: var(--line);
      border-radius: 0.72rem;
      color: var(--accent);
      background: var(--control);
      font-size: 0.92rem;
    }

    .tips-toggle.is-open,
    .tips-toggle:not(:disabled):hover,
    .tips-toggle:not(:disabled):focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .card {
      display: grid;
      gap: 0.48rem;
      padding: 0.68rem;
      border: 0.08rem solid var(--line);
      border-radius: 0.95rem;
      background: rgba(9, 27, 42, 0.88);
    }

    .status-card {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      padding-block: 0.68rem;
    }

    .status-card strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 950;
    }

    .status-card span,
    .notice {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 750;
      line-height: 1.45;
    }

    .connection-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 1.85rem;
      padding: 0.25rem 0.55rem;
      border: 0.08rem solid var(--line);
      border-radius: 999rem;
      color: var(--ok);
      background: #071c2a;
      font-size: 0.76rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .connection-pill.is-active {
      color: var(--ok);
      border-color: var(--ok);
    }

    .connection-pill.is-connecting {
      color: var(--warn);
      border-color: var(--warn);
    }

    .connection-pill.is-unstable {
      color: var(--danger);
      border-color: var(--danger);
    }

    .audio-health {
      display: grid;
      grid-template-columns: auto minmax(5rem, 1fr) auto;
      align-items: center;
      gap: 0.55rem;
      min-height: 2rem;
      padding: 0.36rem 0.55rem;
      border: 0.07rem solid var(--line);
      border-radius: 0.85rem;
      background: #071c2a;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 850;
    }

    .audio-health[hidden] {
      display: none;
    }

    .audio-health[hidden] + .participants-card {
      grid-row: 3 / span 2;
    }

    .mic-level {
      height: 0.48rem;
      overflow: hidden;
      border: 0.07rem solid var(--line);
      border-radius: 999rem;
      background: #020b12;
    }

    .mic-level-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 120ms ease, background-color 160ms ease;
    }

    .audio-health.is-speaking .mic-level-bar {
      background: var(--ok);
    }

    .noise-guard {
      white-space: nowrap;
      color: var(--quiet);
    }

    .call-tips {
      position: absolute;
      top: 4.65rem;
      right: clamp(0.8rem, 2vw, 1.15rem);
      z-index: 12;
      width: min(30rem, calc(100% - 1.6rem));
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      gap: 0.45rem;
      padding: 0.58rem;
      border-color: var(--accent-deep);
      background: #071c2a;
      opacity: 0;
      transform: translateY(-0.25rem);
      pointer-events: none;
      transition: opacity 170ms ease, transform 170ms ease;
    }

    .call-tips.is-open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .tip-item {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 850;
      line-height: 1.25;
    }

    .tip-item i {
      color: var(--accent);
      font-size: 0.88rem;
    }

    label {
      display: grid;
      gap: 0.35rem;
      color: var(--text);
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.62rem 0.8rem;
      border: 0.1rem solid var(--line);
      border-radius: 0.9rem;
      background: #04111c;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    h2 {
      margin: 0;
      min-height: 1.2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      font-size: 0.8rem;
      line-height: 1.15;
      color: var(--muted);
    }

    .participants-card {
      min-height: 0;
      overflow: hidden;
      gap: 0.28rem;
      padding-block: 0.52rem;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .participants-card h2 {
      min-height: 1rem;
      padding-block: 0;
      color: var(--text);
      opacity: 0.9;
    }

    .participants {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.5rem;
      align-items: center;
      min-height: 3.25rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding-right: 0.1rem;
      scrollbar-width: thin;
    }

    .participants-card.is-empty .participants {
      min-height: 100%;
      justify-content: center;
      align-items: center;
      padding: 0.25rem;
    }

    .empty-participants {
      width: min(100%, 26rem);
      display: grid;
      place-items: center;
      gap: 0.42rem;
      text-align: center;
      color: var(--muted);
    }

    .empty-participants strong {
      color: var(--text);
      font-size: 0.98rem;
      font-weight: 950;
    }

    .empty-participants span {
      color: var(--quiet);
      font-size: 0.78rem;
      font-weight: 780;
      line-height: 1.45;
    }

    .participant {
      position: relative;
      width: 3rem;
      height: 3rem;
      display: inline-grid;
      place-items: center;
      border: 0.1rem solid var(--line);
      border-radius: 0.82rem;
      background: var(--panel-raised);
      color: var(--text);
      font-size: 1rem;
      font-weight: 950;
      cursor: pointer;
      outline: none;
      transition: border-color 160ms ease, background-color 160ms ease;
    }

    .participant .avatar-mark {
      position: absolute;
      right: 0.2rem;
      bottom: 0.16rem;
      color: var(--accent);
      font-size: 0.7rem;
    }

    .participant.is-self {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .participant.is-speaking {
      border-color: var(--ok);
      background: #0d3044;
    }

    .participant.is-speaking::after {
      content: "";
      position: absolute;
      inset: -0.18rem;
      border: 0.08rem solid rgba(139, 233, 255, 0.76);
      border-radius: 1rem;
      pointer-events: none;
    }

    .participant.is-speaking .avatar-mark {
      color: var(--ok);
    }

    .participant .speaking-bars {
      position: absolute;
      left: 0.18rem;
      bottom: 0.16rem;
      display: inline-flex;
      gap: 0.08rem;
      align-items: end;
      opacity: 0;
    }

    .participant .speaking-bars span {
      width: 0.12rem;
      border-radius: 999rem;
      background: var(--ok);
    }

    .participant .speaking-bars span:nth-child(1) { height: 0.34rem; }
    .participant .speaking-bars span:nth-child(2) { height: 0.58rem; }
    .participant .speaking-bars span:nth-child(3) { height: 0.42rem; }

    .participant.is-speaking .speaking-bars {
      opacity: 1;
    }

    .is-connected {
      color: var(--ok);
    }

    .is-waiting {
      color: var(--accent);
    }

    .is-muted {
      color: #839eaa;
    }

    .controls {
      display: grid;
      gap: 0.55rem;
    }

    .secondary-controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.48rem;
    }

    .secondary-controls #reconnectBtn {
      display: none;
    }

    button {
      appearance: none;
      min-height: 2.45rem;
      padding: 0.5rem 0.64rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      border: 0.08rem solid var(--line);
      border-radius: 0.78rem;
      background: var(--control);
      color: var(--text);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 900;
      cursor: pointer;
      transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #02111a;
    }

    button.danger {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #ffe3eb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button:not(:disabled):hover,
    button:not(:disabled):focus-visible {
      border-color: var(--line-strong);
      background: #0d2d3f;
    }

    button.primary:not(:disabled):hover,
    button.primary:not(:disabled):focus-visible {
      border-color: #d2f7ff;
      background: #a7efff;
    }

    .primary-action {
      min-height: 3.55rem;
      border-radius: 999rem;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .primary-action i {
      width: 2rem;
      height: 2rem;
      display: inline-grid;
      place-items: center;
      border-radius: 999rem;
      background: rgba(2, 18, 11, 0.12);
    }

    .primary-action.is-leaving {
      border-color: var(--danger);
      background: transparent;
      color: #ffe3eb;
    }

    .notice {
      min-height: 1.35rem;
      max-height: 2.7rem;
      overflow: hidden;
    }

    .secondary-controls button {
      min-height: 2.55rem;
      border-radius: 0.82rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .secondary-controls button:not(:disabled):hover,
    .secondary-controls button:not(:disabled):focus-visible {
      color: var(--text);
    }

    body.is-demo-mode main {
      border-color: var(--accent-deep);
    }

    body.is-demo-mode .connection-pill {
      border-color: var(--accent);
      color: var(--accent);
    }

    .avatar-tooltip {
      position: fixed;
      z-index: 10;
      max-width: min(18rem, calc(100vw - 2rem));
      padding: 0.45rem 0.65rem;
      border: 0.08rem solid var(--line-strong);
      border-radius: 0.65rem;
      background: #020b12;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 850;
      opacity: 0;
      transform: translate(-50%, calc(-100% + 0.25rem));
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      white-space: nowrap;
    }

    .avatar-tooltip.is-showing {
      opacity: 1;
      transform: translate(-50%, -100%);
    }

    @media (max-width: 460px) {
      body {
        padding: max(0.5rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-right)) max(0.5rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-left));
      }

      main {
        height: calc(100svh - 1rem);
        border-radius: 1.12rem;
        gap: 0.42rem;
        padding: 0.58rem;
        grid-template-rows: auto auto auto minmax(4.4rem, 1fr) auto auto;
      }

      .app-icon {
        width: 2.4rem;
        height: 2.4rem;
      }

      .name-box {
        width: min(38vw, 7rem);
      }

      .header-actions {
        gap: 0.42rem;
      }

      .tips-toggle {
        width: 2.15rem;
        height: 2.15rem;
        min-height: 2.15rem;
      }

      .status-card {
        grid-template-columns: 1fr;
      }

      .call-tips {
        grid-template-columns: 1fr;
        top: 4.25rem;
        right: 0.65rem;
        width: calc(100% - 1.3rem);
      }

      .audio-health {
        grid-template-columns: 1fr;
        gap: 0.38rem;
      }

      .participants {
        max-height: 4rem;
      }

      .secondary-controls {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        overflow: visible;
        padding-bottom: 0.1rem;
        scrollbar-width: thin;
        gap: 0.34rem;
      }

      .secondary-controls button {
        min-width: 0;
        min-height: 2.25rem;
        padding-inline: 0.3rem;
      }

      button {
        padding-inline: 0.45rem;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="app-icon" aria-hidden="true"><i class="fa-solid fa-headphones-simple"></i></span>
      <div class="brand">
        <h1>共通電話</h1>
        <div id="roomLabel" class="room-id"></div>
      </div>
      <div class="header-actions">
        <button id="tipsToggleBtn" class="tips-toggle" type="button" aria-controls="callTips" aria-expanded="false" aria-label="使い方のヒント">
          <i class="fa-solid fa-circle-question"></i>
        </button>
        <label class="name-box">
          表示名
          <input id="nameInput" autocomplete="name" maxlength="8" placeholder="名前">
        </label>
      </div>
    </header>

    <section class="card status-card">
      <div>
        <strong id="statusTitle">準備中です</strong>
        <span id="statusText">通話URLを開いた人だけで話せます。</span>
      </div>
      <span id="connectionPill" class="connection-pill"><i class="fa-solid fa-signal"></i><span>待機</span></span>
    </section>

    <section id="callTips" class="card call-tips" aria-live="polite" aria-hidden="true">
      <span class="tip-item"><i class="fa-solid fa-headphones-simple"></i><span>近くの端末ではイヤホン推奨</span></span>
      <span id="deviceTip" class="tip-item"><i class="fa-solid fa-mobile-screen-button"></i><span>端末の音量を小さめに</span></span>
      <span id="qualityTip" class="tip-item"><i class="fa-solid fa-wave-square"></i><span>音声品質を確認中</span></span>
    </section>

    <section id="audioHealth" class="audio-health" hidden aria-live="polite">
      <span id="micState"><i class="fa-solid fa-microphone-lines"></i> マイク待機</span>
      <div class="mic-level" aria-hidden="true"><div id="micLevelBar" class="mic-level-bar"></div></div>
      <span id="noiseGuardState" class="noise-guard">ノイズ抑制中</span>
    </section>

    <section class="card participants-card">
      <h2><i class="fa-solid fa-user-group"></i> 参加者</h2>
      <div id="participants" class="participants"></div>
    </section>

    <div class="controls">
      <button id="joinBtn" class="primary primary-action" type="button"><i class="fa-solid fa-phone"></i><span>参加する</span></button>
      <div class="secondary-controls">
        <button id="muteBtn" type="button" disabled><i class="fa-solid fa-microphone-slash"></i><span>ミュート</span></button>
        <button id="micTestBtn" type="button"><i class="fa-solid fa-stethoscope"></i><span>テスト</span></button>
        <button id="shareBtn" type="button"><i class="fa-solid fa-link"></i><span>URL</span></button>
        <button id="reconnectBtn" type="button" disabled><i class="fa-solid fa-rotate"></i><span>再接続</span></button>
        <button id="qualityModeBtn" type="button"><i class="fa-solid fa-sliders"></i><span>標準</span></button>
        <button id="newCallBtn" type="button"><i class="fa-solid fa-plus"></i><span>新規</span></button>
      </div>
    </div>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>
  </main>
  <div id="avatarTooltip" class="avatar-tooltip" role="tooltip" aria-hidden="true"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import {
      getFirestore,
      addDoc,
      collection,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      serverTimestamp,
      setDoc,
      where
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrzlXIwJrlm9oXNjMw-vCF3OS-2Xe2gZ8",
      authDomain: "test-project-579c6.firebaseapp.com",
      projectId: "test-project-579c6",
      messagingSenderId: "1084238558066",
      appId: "1:1084238558066:web:69ae41be07e19e3513e3eb",
      measurementId: "G-PPM2DBQXQ1"
    };

    const rtcConfig = {
      iceServers: [
        { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }
      ]
    };

    const PARTICIPANT_STALE_MS = 90 * 1000;
    const HEARTBEAT_MS = 30000;
    const SPEAKING_WRITE_MS = 6500;
    const DEFAULT_CALL_ID = "main-room";
    const VOICE_MODES = {
      standard: {
        label: "標準",
        notice: "標準モードです。声の自然さとノイズ抑制のバランスを取ります。",
        autoGainControl: false,
        highpass: 120,
        lowpass: 12000,
        compressorThreshold: -34,
        compressorRatio: 2.4,
        idleGain: 0.55,
        floorGain: 0.16,
        maxBitrate: 48000
      },
      voice: {
        label: "声優先",
        notice: "声優先モードです。イヤホン利用時に声を聞き取りやすくします。",
        autoGainControl: false,
        highpass: 90,
        lowpass: 14000,
        compressorThreshold: -38,
        compressorRatio: 2,
        idleGain: 0.72,
        floorGain: 0.24,
        maxBitrate: 56000
      },
      quiet: {
        label: "静か",
        notice: "静かモードです。スピーカー利用時のザー音を抑えます。",
        autoGainControl: false,
        highpass: 150,
        lowpass: 9500,
        compressorThreshold: -32,
        compressorRatio: 3,
        idleGain: 0.38,
        floorGain: 0.08,
        maxBitrate: 40000
      }
    };
    const VOICE_MODE_ORDER = ["standard", "voice", "quiet"];

    const params = new URLSearchParams(location.search);
    const isDemoMode = params.get("demo") === "1" || location.hash === "#demo";
    const app = isDemoMode ? null : initializeApp(firebaseConfig);
    const db = isDemoMode ? null : getFirestore(app);
    const userId = getOrCreateUserId();
    const sessionId = createSessionId();
    const callId = ensureCallId(params.get("call"));
    const isDefaultCall = callId === DEFAULT_CALL_ID;
    normalizeCallUrl();

    const el = {
      roomLabel: document.getElementById("roomLabel"),
      statusTitle: document.getElementById("statusTitle"),
      statusText: document.getElementById("statusText"),

    let localVoiceGain = null;
    let localVoiceAnalyser = null;

    async function init() {
      el.join.addEventListener("click", function() {
        if (isDemoMode) {
          toggleDemoJoin();
          return;

        if (joined) {
          leaveCall();
        } else {
          joinCall();
        }
      });
      el.mute.addEventListener("click", function() {
        if (isDemoMode) {
          toggleDemoMute();
          return;
        }
        toggleMute();
      });
      el.micTest.addEventListener("click", function() {
        if (isDemoMode) {
          runDemoMicTest();

      el.share.addEventListener("click", function() {
        if (isDemoMode) {

      el.reconnect.addEventListener("click", function() {

      el.name.addEventListener("input", enforceNameLimit);

      el.tipsToggle.addEventListener("click", toggleCallTips);
      document.addEventListener("click", handleOutsideTooltipClick);
      window.addEventListener("beforeunload", function() {
        if (!isDemoMode && joined) markLeft();
      });
      window.addEventListener("pagehide", function() {

      });
      document.addEventListener("visibilitychange", function() {
        if (!isDemoMode && document.visibilityState === "hidden" && joined) updatePresence();
      });
      updateDeviceTip();
      updateQualityModeButton(false);
      if (isDemoMode) {
        initDemoMode();
        return;
      }
      renderParticipants([]);
    }

    function initDemoMode() {
      document.body.classList.add("is-demo-mode");
      joined = false;
      muted = false;

      el.roomLabel.textContent = "デモ / Firestore未接続";
      el.mute.disabled = true;
      el.reconnect.disabled = false;
      if (el.audioHealth) el.audioHealth.hidden = false;
      setStatus("デモ表示中", "Firestore、マイク、WebRTCを使わずに画面だけ確認できます。");
      setNotice("デモモードです。Firestoreの読み取り・書き込みは発生しません。");
      updateConnectionPill("デモ");

    function createDemoParticipants(active) {

      if (!active) return [];

        { userId: "demo-teacher", userName: "Teacher", muted: false, connected: true, speaking: true },
        { userId: "demo-student", userName: "Student", muted: true, connected: false, speaking: false }
      ];
    }

    function updateDemoJoinButton() {
      if (joined) {
        el.join.classList.remove("primary");

      } else {
        el.join.classList.add("primary");

        : "Firestore、マイク、WebRTCを使わずに画面だけ確認できます。");
      setNotice(joined
        ? "デモ参加しました。Firestoreの読み取り・書き込みは発生していません。"

    function toggleDemoMute() {

      renderParticipants(participants);
      el.mute.innerHTML = muted
        ? '<i class="fa-solid fa-microphone"></i><span>解除</span>'
        : '<i class="fa-solid fa-microphone-slash"></i><span>ミュート</span>';
      updateAudioHealth(muted ? 0 : 0.032, !muted, muted ? "ミュート中" : "デモ音声");
      setNotice(muted ? "デモ上でミュートにしました。" : "デモ上でミュートを解除しました。");

    function runDemoMicTest() {

      updateAudioHealth(0.044, true, "デモテスト");

    function reconnectDemoCall() {

    async function copyDemoShareUrl() {

      url.searchParams.set("demo", "1");
      try {

        flashButton(el.share, '<i class="fa-solid fa-check"></i><span>済み</span>');

        setNotice("Demo URL: " + url.toString());

    function openDemoNewCall() {
      const url = new URL(location.origin + location.pathname);
      url.searchParams.set("call", createCallId());
      url.searchParams.set("demo", "1");
      location.href = url.toString();
    }

    async function joinCall() {
      if (joined) return;
      const typedName = getDisplayName(el.name.value);
      const userName = resolveUserName();
      saveName(userName);

      joined = true;
      signalAcceptAfterMs = Date.now() - 5000;
      processedSignals = new Set();
      muted = true;
      updateJoinButton();
      el.mute.disabled = true;
      el.reconnect.disabled = true;
      updateAudioHealth(0, false, "準備中");

      try {
        setStatus("参加しています", "参加者として登録しています。");
        await setDoc(participantRef(userId), {
          userId,
          sessionId,
          userName,
          joined: true,
          left: false,
          muted: true,
          connected: false,
          speaking: false,
          joinedAt: serverTimestamp(),
          lastSeenAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true });
        startHeartbeat();
        startLiveWatchers();
        if (!typedName) {
          setNotice("表示名が未入力なので匿名名で参加します。名前を入れると相手に分かりやすくなります。");
        }
      } catch (error) {
        console.warn(error);
        joined = false;
        updateJoinButton();
        el.mute.disabled = true;
        stopHeartbeat();
        stopLiveWatchers();
        setStatus("参加者登録できませんでした", "Firestore Rulesで参加者の保存が許可されているか確認してください。");
        setNotice("参加者を保存できませんでした。Firestore Rulesを確認してください。");
        return;
      }

      try {
        setStatus("マイクを確認中", "ブラウザのマイク許可で「許可」を選んでください。");
        const voiceSettings = getVoiceModeSettings();
        rawLocalStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: { ideal: true },
            noiseSuppression: { ideal: true },
            autoGainControl: { ideal: voiceSettings.autoGainControl },
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
            sampleSize: { ideal: 16 }
          },
          video: false
        });
        tuneLocalAudioTrack(rawLocalStream);
        localStream = createCleanAudioStream(rawLocalStream);
        applyMuteState(false);
        startSpeakingMonitor();
        el.mute.disabled = false;
        el.reconnect.disabled = false;
        updateAudioHealth(0, false, "ノイズ抑制中");
        setStatus("相手を待っています", "最初はマイクOFFです。話す時だけミュートを解除してください。");
        updatePresence();
        ensurePeersForParticipants();
      } catch (error) {
        console.warn(error);
        el.mute.disabled = true;
        el.reconnect.disabled = true;
        await setDoc(participantRef(userId), {
          sessionId,
          muted: true,
          connected: false,
          speaking: false,
          lastSeenAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true }).catch(console.warn);
        const help = getMicPermissionHelp(error);
        setStatus("参加中・マイク未接続", help);
        setNotice(help);
      }
    }

    function startLiveWatchers() {
      stopLiveWatchers();
      knownParticipantNames = new Map();
      hasParticipantSnapshot = false;
      watchParticipants();
      watchSignals();
    }

    function stopLiveWatchers() {
      if (unsubParticipants) {
        unsubParticipants();
        unsubParticipants = null;
      }
      if (unsubSignals) {
        unsubSignals();
        unsubSignals = null;
      }
      knownParticipantNames = new Map();
      hasParticipantSnapshot = false;
    }

    function watchParticipants() {
      unsubParticipants = onSnapshot(query(collection(callRef(), "participants"), where("left", "==", false)), function(snapshot) {
        const activeParticipants = [];
        snapshot.forEach(function(item) {
          const data = item.data() || {};
          const person = Object.assign({ id: item.id }, data);
          if (!isParticipantActive(person)) {
            markParticipantStale(item, data);
            return;
          }
          activeParticipants.push(person);
        });
        activeParticipants.sort(function(a, b) {
          return getTimestampMillis(a.joinedAt || a.updatedAt) - getTimestampMillis(b.joinedAt || b.updatedAt);
        });
        notifyParticipantChanges(activeParticipants);
        participants = activeParticipants;
        renderParticipants(participants);
        ensurePeersForParticipants();
        updateLocalStatus();
      }, function(error) {
        console.warn(error);
        el.participants.innerHTML = '<div class="notice">参加者を読み込めませんでした。</div>';
      });
    }

    function notifyParticipantChanges(nextItems) {
      const nextMap = new Map();
      nextItems.forEach(function(item) {
        if (item && item.userId) nextMap.set(item.userId, getDisplayName(item.userName || "匿名さん"));
      });
      if (hasParticipantSnapshot) {
        knownParticipantNames.forEach(function(name, id) {
          if (id !== userId && !nextMap.has(id)) {
            setNotice(name + "さんが退出しました。");
          }
        });
      }
      knownParticipantNames = nextMap;
      hasParticipantSnapshot = true;
    }

    function watchSignals() {
      unsubSignals = onSnapshot(query(collection(callRef(), "signals"), where("to", "==", userId)), async function(snapshot) {
        const changes = snapshot.docChanges().sort(function(a, b) {
          return getTimestampMillis((a.doc.data() || {}).createdAt) - getTimestampMillis((b.doc.data() || {}).createdAt);
        });
        for (const change of changes) {
          if (change.type === "removed") continue;
          const id = change.doc.id;
          if (processedSignals.has(id)) continue;
          processedSignals.add(id);
          const signal = change.doc.data() || {};
          if (signal.from === userId || signal.to !== userId) {
            deleteSignalDoc(change.doc).catch(console.warn);
            continue;
          }
          if (signal.toSessionId && signal.toSessionId !== sessionId) {
            deleteSignalDoc(change.doc).catch(console.warn);
            continue;
          }
          if (isStaleSignal(signal)) {
            deleteSignalDoc(change.doc).catch(console.warn);
            continue;
          }
          try {
            await handleSignal(signal);
            deleteSignalDoc(change.doc).catch(console.warn);
          } catch (error) {
            console.warn(error);
          }
        }
      }, function(error) {
        console.warn(error);
        setNotice("接続情報を読み込めませんでした。");
      });
    }

    function startHeartbeat() {
      stopHeartbeat();
      updatePresence();
      heartbeatTimer = window.setInterval(updatePresence, HEARTBEAT_MS);
    }

    function stopHeartbeat() {
      if (heartbeatTimer) {
        window.clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
    }

    function updatePresence() {
      if (!joined) return;
      setDoc(participantRef(userId), {
        sessionId,
        userName: getUserName(),
        left: false,
        muted,
        lastSeenAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true }).catch(console.warn);
    }

    function markParticipantStale(participantDoc, data) {
      if (!participantDoc || !data || data.userId === userId || data.left === true) return;
      setDoc(participantDoc.ref, {
        left: true,
        connected: false,
        speaking: false,
        updatedAt: serverTimestamp()
      }, { merge: true }).catch(console.warn);
    }

    function ensurePeersForParticipants() {
      if (!joined || !localStream) return;
      const activeIds = new Set(participants.map(function(item) { return item.userId; }).filter(Boolean));
      participants.forEach(function(person) {
        if (!person.userId || person.userId === userId) return;
        ensurePeer(person.userId, person.userName || "相手");
      });
      Array.from(peers.keys()).forEach(function(remoteId) {
        if (!activeIds.has(remoteId)) closePeer(remoteId);
      });
    }

    function ensurePeer(remoteId, remoteName) {
      const remotePerson = participants.find(function(item) { return item.userId === remoteId; });
      const remoteSessionId = remotePerson && remotePerson.sessionId ? String(remotePerson.sessionId) : "";
      if (peers.has(remoteId)) {
        const existing = peers.get(remoteId);
        if (!remoteSessionId || existing.remoteSessionId === remoteSessionId) return existing;
        closePeer(remoteId);
      }
      const peer = new RTCPeerConnection(rtcConfig);
      const state = {
        id: remoteId,
        name: remoteName,
        remoteSessionId,
        peer,
        candidates: [],
        audio: createRemoteAudio(remoteId),
        offered: false,
        reconnectTimer: null
      };
      peers.set(remoteId, state);

      localStream.getTracks().forEach(function(track) {
        if ("contentHint" in track) track.contentHint = "speech";
        const sender = peer.addTrack(track, localStream);
        tuneAudioSender(sender);
      });

      peer.ontrack = function(event) {
        state.audio.srcObject = event.streams[0];
        state.audio.volume = 0.9;
        state.audio.play().catch(function() {});
        setStatus("通話中です", "このページを開いたまま話してください。");
      };

      peer.onicecandidate = function(event) {
        if (!event.candidate) return;
        addSignal("candidate", {
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex
        }, remoteId, state.remoteSessionId);
      };

      peer.onconnectionstatechange = function() {
        if (["connected", "completed"].indexOf(peer.connectionState) !== -1) {
          clearReconnectTimer(state);
        }
        if (["failed", "disconnected"].indexOf(peer.connectionState) !== -1) {
          scheduleReconnect(remoteId);
        }
        updateParticipantConnection();
        updateLocalStatus();
      };

      if (shouldCreateOffer(remoteId)) {
        state.offered = true;
        createOffer(remoteId).catch(console.warn);
      }

      return state;
    }

    function shouldCreateOffer(remoteId) {
      return String(userId) < String(remoteId);
    }

    async function createOffer(remoteId, restartIce) {
      const state = peers.get(remoteId);
      if (!state || state.peer.signalingState !== "stable") return;
      if (restartIce && typeof state.peer.restartIce === "function") {
        state.peer.restartIce();
      }
      const offer = await state.peer.createOffer(restartIce ? { iceRestart: true } : undefined);
      offer.sdp = enhanceVoiceSdp(offer.sdp);
      await state.peer.setLocalDescription(offer);
      await addSignal("offer", { type: offer.type, sdp: offer.sdp }, remoteId, state.remoteSessionId);
      scheduleReconnect(remoteId);
    }

    async function handleSignal(signal) {
      if (!joined || !localStream || !signal.from) return;
      if (signal.toSessionId && signal.toSessionId !== sessionId) return;
      const state = ensurePeer(signal.from, signal.fromName || "相手");
      const peer = state.peer;

      if (signal.type === "offer" && signal.payload) {
        if (peer.signalingState !== "stable") {
          await Promise.all([
            peer.setLocalDescription({ type: "rollback" }).catch(function() {}),
            peer.setRemoteDescription(new RTCSessionDescription(signal.payload))
          ]);
        } else {
          await peer.setRemoteDescription(new RTCSessionDescription(signal.payload));
        }
        const answer = await peer.createAnswer();
        answer.sdp = enhanceVoiceSdp(answer.sdp);
        await peer.setLocalDescription(answer);
        await addSignal("answer", { type: answer.type, sdp: answer.sdp }, signal.from, signal.fromSessionId || state.remoteSessionId);
        await flushCandidates(state);
      } else if (signal.type === "answer" && signal.payload) {
        if (peer.signalingState !== "stable") {
          await peer.setRemoteDescription(new RTCSessionDescription(signal.payload));
          await flushCandidates(state);
          clearReconnectTimer(state);
        }
      } else if (signal.type === "candidate" && signal.payload) {
        if (peer.remoteDescription) {
          await addCandidate(peer, signal.payload);
        } else {
          state.candidates.push(signal.payload);
        }
      }
    }

    async function flushCandidates(state) {
      while (state.candidates.length) {
        await addCandidate(state.peer, state.candidates.shift());
      }
    }

    async function addCandidate(peer, payload) {
      try {
        await peer.addIceCandidate(new RTCIceCandidate(payload));
      } catch (error) {
        console.warn(error);
      }
    }

    function addSignal(type, payload, to, toSessionId) {
      return addDoc(collection(callRef(), "signals"), {
        from: userId,
        fromSessionId: sessionId,
        fromName: getUserName(),
        to,
        toSessionId: toSessionId || "",
        type,
        payload,
        createdAt: serverTimestamp()
      });
    }

    function isStaleSignal(signal) {
      const timeValue = getTimestampMillis(signal && signal.createdAt);
      return !!timeValue && timeValue < signalAcceptAfterMs;
    }

    function deleteSignalDoc(signalDoc) {
      return deleteDoc(signalDoc.ref);
    }

    function scheduleReconnect(remoteId) {
      const state = peers.get(remoteId);
      if (!state || !shouldCreateOffer(remoteId)) return;
      clearReconnectTimer(state);
      state.reconnectTimer = window.setTimeout(function() {
        const current = peers.get(remoteId);
        if (!current || !joined || !localStream) return;
        if (["connected", "completed"].indexOf(current.peer.connectionState) !== -1) return;
        if (current.peer.signalingState !== "stable") {
          scheduleReconnect(remoteId);
          return;
        }
        createOffer(remoteId, true).catch(console.warn);
      }, 8000);
    }

    function clearReconnectTimer(state) {
      if (!state || !state.reconnectTimer) return;
      window.clearTimeout(state.reconnectTimer);
      state.reconnectTimer = null;
    }

    function renderParticipants(items) {
      const participantsCard = el.participants.closest(".participants-card");
      if (participantsCard) participantsCard.classList.toggle("is-empty", !items.length);
      if (!items.length) {
        el.participants.innerHTML = '<div class="empty-participants">' +
          '<strong>相手を待っています</strong>' +
          '<span>同じURLを開いた人が参加すると、ここに表示されます。</span>' +
          '</div>';
        return;
      }
      el.participants.innerHTML = items.map(function(item) {
        const isSelf = item.userId === userId;
        const name = getDisplayName(item.userName || "匿名さん");
        const initial = getInitial(name);
        const status = item.muted ? "ミュート" : (item.connected ? "接続中" : "待機");
        const statusClass = item.muted ? "is-muted" : (item.connected ? "is-connected" : "is-waiting");
        const classes = ["participant"];
        if (isSelf) classes.push("is-self");
        if (item.speaking && !item.muted) classes.push("is-speaking");
        return '<button class="' + classes.join(" ") + '" type="button" data-name="' + escapeHtml(name + (isSelf ? "（自分）" : "")) + '" data-status="' + escapeHtml(status) + '" aria-label="' + escapeHtml(name + " " + status) + '">' +
          '<span class="avatar-initial">' + escapeHtml(initial) + '</span>' +
          '<span class="speaking-bars" aria-hidden="true"><span></span><span></span><span></span></span>' +
          '<i class="fa-solid fa-user avatar-mark ' + statusClass + '"></i>' +
          '</button>';
      }).join("");
    }

    function updateLocalStatus() {
      if (!joined) return;
      const others = participants.filter(function(item) { return item.userId && item.userId !== userId; });
      const connected = Array.from(peers.values()).some(function(item) {
        return item.peer && ["connected", "completed"].indexOf(item.peer.connectionState) !== -1;
      });
      if (connected) {
        setStatus("通話中です", muted ? "マイクOFFです。話す時だけ解除できます。" : "話していない時はミュートがおすすめです。");
      } else if (others.length) {
        setStatus("接続しています", "相手と音声をつないでいます。少し待ってください。");
      } else {
        setStatus("相手を待っています", "ほかの人が同じURLから参加すると、自動でつながります。");
      }
    }

    function updateParticipantConnection() {
      if (!joined) return;
      const connected = Array.from(peers.values()).some(function(item) {
        return item.peer && ["connected", "completed"].indexOf(item.peer.connectionState) !== -1;
      });
      const unstable = Array.from(peers.values()).some(function(item) {
        return item.peer && ["failed", "disconnected"].indexOf(item.peer.connectionState) !== -1;
      });
      updateConnectionPill(unstable ? "不安定" : (connected ? "通話中" : (participants.length > 1 ? "接続中" : "待機")));
      setDoc(participantRef(userId), {
        sessionId,
        connected,
        lastSeenAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true }).catch(console.warn);
    }

    function toggleMute() {
      muted = !muted;
      applyMuteState(true);
    }

    async function runMicTest() {
      let testStream = null;
      let testContext = null;
      let testTimer = null;
      try {
        el.micTest.disabled = true;
        setStatus("マイクテスト中", "声を出すと下のバーが動きます。");
        setNotice("3秒ほど声を出してください。声の大きさを確認します。");
        const voiceSettings = getVoiceModeSettings();
        const stream = rawLocalStream || localStream || await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: { ideal: true },
            noiseSuppression: { ideal: true },
            autoGainControl: { ideal: voiceSettings.autoGainControl },
            channelCount: { ideal: 1 }
          },
          video: false
        });
        if (!rawLocalStream && !localStream) testStream = stream;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          setNotice("このブラウザでは音量テストを表示できません。");
          return;
        }
        testContext = new AudioContextClass();
        const source = testContext.createMediaStreamSource(stream);
        const analyser = testContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        const data = new Uint8Array(analyser.fftSize);
        const startedAt = Date.now();
        const tick = function() {
          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i += 1) {
            const value = (data[i] - 128) / 128;
            sum += value * value;
          }
          const rms = Math.sqrt(sum / data.length);
          updateAudioHealth(rms, rms > 0.026, "テスト中");
          if (Date.now() - startedAt < 2600) {
            testTimer = window.setTimeout(tick, 120);
          } else {
            if (rms > 0.026) {
              setNotice("声がしっかり届いています。");
            } else if (rms > 0.012) {
              setNotice("マイクは反応しています。少し声が小さめです。");
            } else {
              setNotice("マイク音量が小さいようです。端末のマイク許可や入力先を確認してください。");
            }
          }
        };
        if (el.audioHealth) el.audioHealth.hidden = false;
        tick();
      } catch (error) {
        console.warn(error);
        setNotice(getMicPermissionHelp(error));
      } finally {
        window.setTimeout(function() {
          if (testTimer) window.clearTimeout(testTimer);
          if (testStream) testStream.getTracks().forEach(function(track) { track.stop(); });
          if (testContext && typeof testContext.close === "function") testContext.close().catch(function() {});
          el.micTest.disabled = false;
          if (!joined) {
            updateAudioHealth(0, false, "停止中");
            setReadyStatus();
          }
        }, 2900);
      }
    }

    function applyVoiceModeToAudioGraph() {
      const settings = getVoiceModeSettings();
      if (localHighpass) localHighpass.frequency.value = settings.highpass;
      if (localLowpass) localLowpass.frequency.value = settings.lowpass;
      if (localCompressor) {

      }
      if (rawLocalStream) tuneLocalAudioTrack(rawLocalStream);
      Array.from(peers.values()).forEach(function(state) {

    function getMicPermissionHelp(error) {
      const name = error && error.name ? error.name : "";
      const ua = navigator.userAgent || "";
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/.test(ua);
      if (name === "NotAllowedError" || name === "SecurityError") {
        if (isIOS) return "マイクが許可されていません。Safariのアドレスバー左側の設定、または設定アプリのSafari > マイクを確認してください。";
        if (isAndroid) return "マイクが許可されていません。ブラウザのサイト設定から、このURLのマイクを許可してください。";
        return "マイクが許可されていません。ブラウザのアドレスバー付近から、このサイトのマイクを許可してください。";
      }
      if (name === "NotFoundError" || name === "DevicesNotFoundError") {
        return "マイクが見つかりません。イヤホン、ヘッドセット、端末の入力設定を確認してください。";
      }
      return "マイクを開始できませんでした。端末のマイク許可、入力先、ブラウザ設定を確認してください。";
    }

    function createCleanAudioStream(stream) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return stream;
        const settings = getVoiceModeSettings();
        localAudioContext = new AudioContextClass();
        const source = localAudioContext.createMediaStreamSource(stream);
        const highpass = localAudioContext.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.value = settings.highpass;
        highpass.Q.value = 0.7;

        const lowpass = localAudioContext.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = settings.lowpass;
        lowpass.Q.value = 0.5;

        const compressor = localAudioContext.createDynamicsCompressor();
        compressor.threshold.value = settings.compressorThreshold;
        compressor.knee.value = 18;
        compressor.ratio.value = settings.compressorRatio;
        compressor.attack.value = 0.006;
        compressor.release.value = 0.18;
        localHighpass = highpass;
        localLowpass = lowpass;
        localCompressor = compressor;

        localVoiceAnalyser = localAudioContext.createAnalyser();
        localVoiceAnalyser.fftSize = 1024;

        const gain = localAudioContext.createGain();
        gain.gain.value = 1;
        localVoiceGain = gain;
        const destination = localAudioContext.createMediaStreamDestination();

        source.connect(highpass);
        highpass.connect(lowpass);
        lowpass.connect(compressor);
        compressor.connect(localVoiceAnalyser);
        localVoiceAnalyser.connect(gain);
        gain.connect(destination);
        return destination.stream;
      } catch (error) {
        console.warn(error);
        return stream;
      }
    }

    function tuneLocalAudioTrack(stream) {
      const track = stream && stream.getAudioTracks ? stream.getAudioTracks()[0] : null;
      if (!track) return;
      const settings = getVoiceModeSettings();
      if ("contentHint" in track) track.contentHint = "speech";
      if (typeof track.applyConstraints !== "function") return;
      track.applyConstraints({
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: settings.autoGainControl,
        channelCount: 1
      }).catch(function(error) {
        console.warn(error);
      });
    }

    function tuneAudioSender(sender) {
      if (!sender || typeof sender.getParameters !== "function" || typeof sender.setParameters !== "function") return;
      try {
        const settings = getVoiceModeSettings();
        const params = sender.getParameters() || {};
        params.encodings = params.encodings && params.encodings.length ? params.encodings : [{}];
        params.encodings[0].maxBitrate = settings.maxBitrate;
        params.encodings[0].priority = "high";
        sender.setParameters(params).catch(function(error) {
          console.warn(error);
        });
      } catch (error) {
        console.warn(error);
      }
    }

    function enhanceVoiceSdp(sdp) {
      if (!sdp) return sdp;
      const opusMatch = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/i);
      if (!opusMatch) return sdp;
      const payloadType = opusMatch[1];
      const voiceParams = "minptime=10;useinbandfec=1;usedtx=1;maxaveragebitrate=48000;stereo=0;sprop-stereo=0";
      const fmtpRegex = new RegExp("a=fmtp:" + payloadType + " ([^\\r\\n]*)", "i");
      if (fmtpRegex.test(sdp)) {
        return sdp.replace(fmtpRegex, function(line, params) {
          const nextParams = params.split(";").map(function(item) {
            return item.trim();
          }).filter(Boolean);
          voiceParams.split(";").forEach(function(item) {
            const key = item.split("=")[0];
            const index = nextParams.findIndex(function(param) {
              return param.split("=")[0] === key;
            });
            if (index >= 0) nextParams[index] = item;
            else nextParams.push(item);
          });
          return "a=fmtp:" + payloadType + " " + nextParams.join(";");
        });
      }
      return sdp.replace(
        new RegExp("(a=rtpmap:" + payloadType + " opus/48000/2\\r?\\n)", "i"),
        "$1a=fmtp:" + payloadType + " " + voiceParams + "\\r\\n"
      );
    }

    function startSpeakingMonitor() {
      stopSpeakingMonitor();
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!localAudioContext) localAudioContext = new AudioContextClass();
        if (localVoiceAnalyser) {
          localAnalyser = localVoiceAnalyser;
        } else {
          const source = localAudioContext.createMediaStreamSource(rawLocalStream || localStream);
          localAnalyser = localAudioContext.createAnalyser();
          localAnalyser.fftSize = 512;
          source.connect(localAnalyser);
        }
        const data = new Uint8Array(localAnalyser.fftSize);
        speakingTimer = window.setInterval(function() {
          if (!localAnalyser || !joined) return;
          localAnalyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i += 1) {
            const value = (data[i] - 128) / 128;
            sum += value * value;
          }
          const rms = Math.sqrt(sum / data.length);
          const nextSpeaking = !muted && rms > 0.026;
          updateSoftNoiseGuard(rms, nextSpeaking);
          updateAudioHealth(rms, nextSpeaking, muted ? "ミュート中" : (nextSpeaking ? "会話中" : "ノイズ抑制中"));
          const now = Date.now();
          if (!muted && !nextSpeaking && participants.length > 1 && now - lastMuteReminderAt > 45000) {
            lastMuteReminderAt = now;
            setNotice("話していない時はミュートにすると、相手にノイズが届きにくくなります。");
          }
          if (nextSpeaking !== speakingState || now - lastSpeakingWrite > SPEAKING_WRITE_MS) {
            speakingState = nextSpeaking;
            lastSpeakingWrite = now;
            setDoc(participantRef(userId), {
              sessionId,
              speaking: speakingState,
              updatedAt: serverTimestamp(),
              lastSeenAt: serverTimestamp()
            }, { merge: true }).catch(console.warn);
          }
        }, 260);
      } catch (error) {
        console.warn(error);
      }
    }

    function updateSoftNoiseGuard(rms, isSpeaking) {
      if (!localVoiceGain || !localAudioContext) return;
      const settings = getVoiceModeSettings();
      const targetGain = muted ? 0 : (isSpeaking ? 1 : (rms < 0.009 ? settings.floorGain : settings.idleGain));
      try {
        localVoiceGain.gain.setTargetAtTime(targetGain, localAudioContext.currentTime, isSpeaking ? 0.025 : 0.11);
      } catch (error) {
        localVoiceGain.gain.value = targetGain;
      }
    }

    function updateAudioHealth(rms, isSpeaking, label) {
      if (!el.audioHealth) return;
      el.audioHealth.hidden = !joined && label !== "テスト中";
      const level = Math.max(0, Math.min(100, Math.round(rms * 520)));
      if (el.micLevelBar) el.micLevelBar.style.width = level + "%";
      el.audioHealth.classList.toggle("is-speaking", !!isSpeaking);
      if (el.micState) {
        const icon = muted ? "fa-microphone-slash" : (isSpeaking ? "fa-microphone-lines" : "fa-microphone");
        const text = muted ? "マイクOFF" : (isSpeaking ? "話しています" : "待機中");
        el.micState.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + text;
      }
      if (el.noiseGuardState) el.noiseGuardState.textContent = label || "ノイズ抑制中";
    }

    function stopSpeakingMonitor() {
      if (speakingTimer) {
        window.clearInterval(speakingTimer);
        speakingTimer = null;
      }
      speakingState = false;
      updateAudioHealth(0, false, "停止中");
    }

    function ensureCallId(value) {
      const safe = String(value || "").trim().replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 48);
      return safe || DEFAULT_CALL_ID;
    }

    function normalizeCallUrl() {
      try {
        const url = new URL(location.href);
        let changed = false;
        if (url.searchParams.get("call") !== callId) {
          url.searchParams.set("call", callId);
          changed = true;
        }
        ["v", "ts", "cache", "cb"].forEach(function(key) {
          if (url.searchParams.has(key)) {
            url.searchParams.delete(key);
            changed = true;
          }
        });
        if (changed && history.replaceState) {
          history.replaceState(null, "", url.toString());
        }
      } catch (error) {
        // URLを整えられない環境でも、内部の通話IDは固定して続けます。
      }
    }

    function getShareUrl() {
      try {
        const url = new URL(location.origin + location.pathname);
        url.searchParams.set("call", callId);
        return url.toString();
      } catch (error) {
        return location.href;
      }
    }

    }

    function getOrCreateUserId() {
      try {
        const key = "standaloneVoiceUserId";
        const existing = localStorage.getItem(key);
        if (existing) return existing;
        const next = "voice-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem(key, next);
        return next;

    function saveName(forcedName) {
      enforceNameLimit();
      if (typeof forcedName === "string" && forcedName) {
        el.name.value = getDisplayName(forcedName);
      }
      const typed = getDisplayName(el.name.value);
      try {
        if (typed) {
          localStorage.setItem("standaloneVoiceUserName", typed);
        } else {
          localStorage.removeItem("standaloneVoiceUserName");
        }
      } catch (error) {
        // 保存できない環境でも通話は続けます。
      }
      if (joined) updatePresence();
    }

    function getUserName() {
      return resolveUserName();
    }

    function resolveUserName() {
      const typed = getDisplayName(el.name.value);
      if (typed) return typed;
      const anonymousSuffix = String(userId).replace(/[^a-zA-Z0-9]/g, "").slice(-4) || Math.random().toString(36).slice(2, 6);
      return getDisplayName("匿名" + anonymousSuffix);
    }

    function getDisplayName(value) {
      return String(value || "").trim().slice(0, 8);
    }

    function enforceNameLimit() {
      const next = getDisplayName(el.name.value);
      if (el.name.value !== next) el.name.value = next;
    }

    function getInitial(name) {
      const value = getDisplayName(name);
      return value ? value.slice(0, 1).toUpperCase() : "匿";
    }

    function getTimestampMillis(value) {
      if (!value) return 0;
      if (typeof value.toMillis === "function") return value.toMillis();
      if (typeof value.toDate === "function") return value.toDate().getTime();
      if (typeof value === "number") return value;
      const date = value instanceof Date ? value : new Date(value);
      return Number.isNaN(date.getTime()) ? 0 : date.getTime();
    }

    function isParticipantActive(item) {
      if (!item || item.left === true) return false;
      const timeValue = getTimestampMillis(item.lastSeenAt || item.updatedAt || item.joinedAt);
      if (!timeValue) return true;
      return Date.now() - timeValue <= PARTICIPANT_STALE_MS;
    }

    function setReadyStatus() {
      setStatus("参加できます", isDefaultCall
        ? "このURLを開いた人は、同じ音声通話に入れます。"
        : "参加するとマイク確認が開きます。URLを共有した人だけが同じ通話に入れます。");
    }

    function setStatus(title, text) {
      el.statusTitle.textContent = title;
      el.statusText.textContent = text || "";
      if (title.indexOf("通話中") !== -1) updateConnectionPill("通話中");
      else if (title.indexOf("不安定") !== -1 || title.indexOf("できません") !== -1 || title.indexOf("未接続") !== -1) updateConnectionPill("不安定");
      else if (title.indexOf("接続") !== -1 || title.indexOf("参加しています") !== -1 || title.indexOf("マイク") !== -1) updateConnectionPill("接続中");
      else if (title.indexOf("デモ") !== -1) updateConnectionPill(joined ? "デモ通話" : "デモ");
      else updateConnectionPill("待機");
    }

    function setNotice(text) {
      el.notice.textContent = text || "";
      if (!text) return;
      window.clearTimeout(el.notice.hideTimer);
      el.notice.hideTimer = window.setTimeout(function() {
        el.notice.textContent = "";
      }, 3500);
    }

    function cssEscape(value) {
      return String(value || "").replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function(ch) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
      });
    }
  </script>
